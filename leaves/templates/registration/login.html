{% extends 'leaves/base.html' %}

{% block title %}Login - Leave Management System{% endblock %}

{% block header_title %}System Login{% endblock %}

{% block content %}
<div class="glass-card" style="max-width: 400px; margin: 4rem auto;">
    <h3 style="text-align: center; margin-bottom: 2rem;">Sign In</h3>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div style="margin-top: 2rem;">
            <button type="submit" class="button" style="width: 100%;">Login</button>
        </div>
    </form>
    {% if form.errors %}
        <p style="color: var(--danger); margin-top: 1rem; text-align: center;">Invalid username or password.</p>
    {% endif %}
</div>

<style>
    form p {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        margin-bottom: 1rem;
    }
    form input {
        padding: 0.75rem;
        border: 1px solid var(--border-color);
        border-radius: 0.5rem;
        width: 100%;
    }
</style>
{% endblock %}
