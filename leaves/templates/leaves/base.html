<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Leave Management System{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --sidebar-bg: #1e293b;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --danger: #ef4444;
            --success: #10b981;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            min-height: 100vh;
        }

        .layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            min-height: calc(100vh - 80px);
        }

        .top-header {
            background-color: var(--sidebar-bg);
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            z-index: 100;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .top-header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Sidebar */
        aside {
            background-color: var(--sidebar-bg);
            color: #ffffff;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        nav ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        nav a {
            color: #cbd5e1;
            text-decoration: none;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            transition: all 0.2s;
            font-weight: 500;
        }

        nav a:hover {
            background-color: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        nav a.active {
            background-color: var(--primary-color);
            color: white;
        }

        /* Main Content */
        main {
            padding: 2.5rem;
            overflow-y: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .button {
            display: inline-flex;
            align-items: center;
            padding: 0.625rem 1.25rem;
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
            border-radius: 0.5rem;
            font-weight: 500;
            transition: background 0.2s;
            border: none;
            cursor: pointer;
            font-size: 0.875rem;
        }

        .button:hover {
            background-color: var(--primary-hover);
        }

        .button.secondary {
            background-color: #cbd5e1;
            color: var(--text-main);
        }

        .button.secondary:hover {
            background-color: #94a3b8;
        }

        .button.danger {
            background-color: var(--danger);
        }

        .button.danger:hover {
            background-color: #dc2626;
        }

        /* Card/Glass Design */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        /* Status Badges */
        .status-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .status-pending { background: #fef9c3; color: #854d0e; }
        .status-approved { background: #dcfce7; color: #166534; }
        .status-rejected { background: #fee2e2; color: #991b1b; }

        /* Responsive */
        @media (max-width: 1024px) {
            .layout {
                grid-template-columns: 1fr;
            }
            aside {
                display: none;
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header class="top-header">
        <h1>Leave Management System</h1>
    </header>
    <div class="layout">
        <aside>
            <nav>
                <ul>
                    <li><a href="{% url 'request_list' %}" class="{% if request.resolver_match.url_name == 'request_list' %}active{% endif %}">Dashboard</a></li>
                    <li><a href="{% url 'request_create' %}" class="{% if request.resolver_match.url_name == 'request_create' %}active{% endif %}">New Request</a></li>
                </ul>
            </nav>
        </aside>
        <main>
            <div class="header">
                 <h2>{% block header_title %}{% endblock %}</h2>
                 {% block header_action %}{% endblock %}
            </div>
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
